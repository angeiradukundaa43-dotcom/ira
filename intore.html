
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intore Workout | Login</title>

    <link rel="stylesheet" href="intore.css">
</head>
<body>

<div class="overlay">

    <div class="login-container">

        <div class="form-area">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in and continue learning Rwanda's traditional dances.
            </p>

            <form>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        placeholder="Email, Username or Phone"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Password"
                        required>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">

                    Login

                </button>

            </form>

            <div class="divider">

                <span>or</span>

            </div>

            <div class="social-buttons">

                <button class="google">

                    <i class="fa-brands fa-google"></i>

                    Google

                </button>

                <button class="facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                    Facebook

                </button>

            </div>

            <p class="register">

                Don't have an account?

                <a href="#">Create Account</a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
